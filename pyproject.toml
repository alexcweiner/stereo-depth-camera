[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-depth"
version = "0.1.0"
description = "Viam module: software stereo depth from a stock SBS webcam"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "stereo-depth contributors" }]
keywords = ["viam", "stereo", "depth", "opencv", "robotics"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []

[project.optional-dependencies]
module = [
  "opencv-python-headless>=4.10,<4.14",
  "viam-sdk>=0.40,<1",
]

[project.scripts]

[tool.setuptools.packages.find]
where = ["src"]
