services:
  viam-server:
    build:
      context: .
      args:
        VIAM_CHANNEL: ${VIAM_CHANNEL:-stable}
    image: stereo-depth-viam:${VIAM_CHANNEL:-stable}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VIAM_PORT:-8080}:8080"
      - "127.0.0.1:${BRIDGE_PORT:-8081}:8081"
    environment:
      STEREO_DEPTH_WEBRTC: ${STEREO_DEPTH_WEBRTC:-0}
    volumes:
      - ./local/viam.json:/config/viam.json:ro
      - ./local/viam-data:/var/lib/viam
    command: ["-config", "/config/viam.json", "-no-tls", "-debug"]

  webapp:
    build:
      context: .
      args:
        VIAM_CHANNEL: ${VIAM_CHANNEL:-stable}
    image: stereo-depth-viam:${VIAM_CHANNEL:-stable}
    profiles: ["webapp"]
    init: true
    environment:
      STEREO_DEPTH_WEBRTC: "1"
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8081}:8081"
    entrypoint: ["stereo-depth-web"]
