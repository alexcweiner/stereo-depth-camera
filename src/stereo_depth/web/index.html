<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stereo Depth → Viam</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">Viam module</p>
      <h1>Stereo depth</h1>
      <p class="lede">One dual-lens USB camera. Software depth. Stream it to Viam.</p>
    </header>

    <div class="controls">
      <button id="refresh" type="button">Enable camera access</button>
      <label class="orientation"><input id="rotate" type="checkbox"> Rotate 180°</label>
      <label>
        Camera
        <select id="device" disabled>
          <option value="">Select a camera…</option>
        </select>
      </label>
      <button id="start" type="button" disabled>Start streaming</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>

    <p id="status" role="status">Enable camera access to begin.</p>

    <section class="previews" aria-label="Live previews">
      <figure>
        <figcaption>Color — side-by-side stereo</figcaption>
        <video id="preview" autoplay muted playsinline></video>
      </figure>
      <figure>
        <figcaption>Left eye · Right eye</figcaption>
        <div class="eyes">
          <canvas id="eye-left" width="640" height="360"></canvas>
          <canvas id="eye-right" width="640" height="360"></canvas>
        </div>
      </figure>
    </section>

    <footer class="foot">
      Keep this tab open while streaming. Viam resources: <code>cam</code>, <code>cam-left</code>, <code>cam-right</code>.
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
